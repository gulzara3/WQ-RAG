[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wqrag"
version = "1.0.0"
description = "WQ-RAG: AI-enabled root-cause diagnosis of water-quality anomalies with retrieval-augmented LLMs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Gulzar Alam"},
  {name = "I. Ihsanullah"},
]
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "scikit-learn>=1.3", "torch>=2.1",
  "requests>=2.31", "matplotlib>=3.8",
]

[project.optional-dependencies]
rag = [
  "langchain>=0.3", "langchain-core>=0.3", "langchain-community>=0.3",
  "langchain-text-splitters>=0.3", "langchain-chroma>=0.2", "langchain-huggingface>=0.1",
  "langchain-ollama>=0.2", "chromadb>=0.5", "sentence-transformers>=3.0", "pypdf>=4.0",
]
map = ["cartopy>=0.22"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["wqrag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: trains small neural nets (CPU ok)"]
